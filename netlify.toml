[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://clerk.tattoogomk.com.br https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com https://*.clerk.services https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com https://*.clerk.com https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' data: blob: https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://*.cloudflare.com wss://challenges.cloudflare.com wss://*.challenges.cloudflare.com wss://*.cloudflare.com https://clerk.tattoogomk.com.br https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com https://*.clerk.services https://*.protect.clerk.com:* https://clerk-telemetry.com https://*.clerk-telemetry.com https://img.clerk.com https: wss:; frame-src 'self' data: blob: https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://clerk.tattoogomk.com.br https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com https://*.clerk.services https://*.protect.clerk.com; child-src 'self' blob: data: https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://clerk.tattoogomk.com.br https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com https://*.clerk.services https://*.protect.clerk.com; worker-src 'self' blob: data: https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://clerk.tattoogomk.com.br https://*.clerk.accounts.dev https://*.clerk.com https://clerk.com https://*.clerk.services https://*.protect.clerk.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
